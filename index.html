<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Account Hub - Pasar Terpercaya Akun Free Fire Anda</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        .top-nav {
            background-color: #121826;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1f293d;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .logo-badge {
            background: linear-gradient(135deg, #ff7e00, #ffbb00);
            color: #000;
            font-weight: 800;
            font-size: 20px;
            padding: 6px 14px;
            border-radius: 8px;
            letter-spacing: 1px;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo-text span {
            font-size: 11px;
            color: #9ca3af;
        }

        .search-bar {
            position: relative;
            width: 350px;
        }

        .search-bar input {
            width: 100%;
            background-color: #1a2235;
            border: 1px solid #2d3748;
            padding: 10px 15px 10px 40px;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .search-bar i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-actions a {
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-actions a:hover {
            color: #ffbb00;
        }

        /* Sub Navbar */
        .sub-nav {
            background-color: #0e131f;
            padding: 12px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a2235;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
            cursor: pointer;
            padding-bottom: 4px;
        }

        .nav-links a.active, .nav-links a:hover {
            color: #ffbb00;
            border-bottom: 2px solid #ffbb00;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-login {
            background-color: transparent;
            color: #ffbb00;
            border: 1px solid #ffbb00;
        }

        .btn-login:hover {
            background-color: rgba(255, 187, 0, 0.1);
        }

        .btn-register {
            background: linear-gradient(135deg, #ff7e00, #ffbb00);
            color: #000;
        }

        .btn-register:hover {
            opacity: 0.9;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
        }

        /* Page System Dynamic Styling */
        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        /* Hero Banner */
        .hero-banner {
            background: linear-gradient(90deg, #161c2d 0%, #1e1b38 50%, #281832 100%);
            border-radius: 12px;
            padding: 35px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #2a2342;
            position: relative;
            overflow: hidden;
        }

        .hero-text h2 {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .hero-text p {
            color: #9ca3af;
            font-size: 13px;
        }

        /* Filter Section */
        .filter-section {
            background-color: #121826;
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            border: 1px solid #1f293d;
        }

        .filter-box {
            flex: 1;
            position: relative;
        }

        .filter-box select, .filter-box input {
            width: 100%;
            background-color: #1a2235;
            border: 1px solid #2d3748;
            padding: 10px 15px;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background-color: #121826;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f293d;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #ffbb00;
        }

        .product-img {
            height: 180px;
            background: linear-gradient(135deg, #252d42, #182030);
            position: relative;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffbb00;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            border: 1px solid #ffbb00;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-desc {
            font-size: 11px;
            color: #9ca3af;
            line-height: 1.4;
            margin-bottom: 15px;
            flex: 1;
        }

        .seller-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #1a2235;
            padding-top: 12px;
        }

        .seller-name {
            font-size: 12px;
            color: #d1d5db;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .seller-name span {
            color: #f59e0b;
        }

        .product-price {
            font-size: 15px;
            font-weight: 700;
            color: #ffbb00;
        }

        .product-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-detail {
            flex: 1;
            background-color: #1a2235;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid #2d3748;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: 0.2s;
        }
