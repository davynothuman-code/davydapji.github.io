<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Expeditions - Jelajahi Keindahan Alam</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* RESET & GENERAL STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: #333;
            background-color: #f8f9fa;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVIGATION BAR */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: 0.3s;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #2ec4b6;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 25px;
        }

        nav ul li a {
            color: #fff;
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #2ec4b6;
        }

        .btn-nav {
            background-color: #2ec4b6;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-nav:hover {
            background-color: #20968b;
            transform: translateY(-2px);
        }

        /* HERO SECTION */
        .hero {
            position: relative;
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 1.2rem;
            max-width: 650px;
            margin-bottom: 30px;
            color: #e0e0e0;
            font-weight: 300;
        }

        .btn-hero {
            background-color: #2ec4b6;
            color: #fff;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(46, 196, 182, 0.4);
        }

        .btn-hero:hover {
            background-color: #20968b;
            transform: translateY(-3px);
        }

        /* DESTINATIONS SECTION */
        .destinations {
            padding: 80px 8%;
            text-align: center;
        }

        .section-title {
            font-size: 2.2rem;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .section-subtitle {
            color: #64748b;
            margin-bottom: 50px;
            font-size: 1rem;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .card-img {
            height: 220px;
            width: 100%;
            object-fit: cover;
        }

        .card-content {
            padding: 25px;
            text-align: left;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-content h3 {
            font-size: 1.3rem;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .card-content p {
            color: #64748b;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .btn-card {
            align-self: flex-start;
            background-color: #0f172a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-card:hover {
            background-color: #2ec4b6;
        }

        /* FOOTER */
        footer {
            background-color: #0f172a;
            color: #94a3b8;
            padding: 60px 8% 30px;
        }

        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            margin-bottom: 40px;
        }

        .footer-col h4 {
            color: #fff;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col ul li {
            margin-bottom: 12px;
        }

        .footer-col ul li a {
            transition: 0.3s;
        }

        .footer-col ul li a:hover {
            color: #2ec4b6;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .social-links a {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            transition: 0.3s;
        }

        .social-links a:hover {
            background: #2ec4b6;
        }

        .footer-bottom {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 768px) {
            header {
                padding: 15px 5%;
            }

            nav {
                display: none; /* Bisa dikembangkan dengan hamburger menu */
            }

            .hero h1 {
                font-size: 2.2rem;
            }

            .hero p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="logo">
            <i class="fa-solid => fa-mountain-sun"></i> PEAK EXPEDITIONS
        </div>
        <nav>
            <ul>
                <li><a href="#home">Beranda</a></li>
                <li><a href="#destinations">Destinasi</a></li>
                <li><a href="#about">Tentang Kami</a></li>
                <li><a href="#contact">Kontak</a></li>
            </ul>
        </nav>
        <a href="#booking" class="btn-nav">Pesan Sekarang</a>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="home">
        <h1>Jelaj
